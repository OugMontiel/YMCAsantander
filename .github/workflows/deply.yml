name: Build and Deploy to VPS

on:
  push:
    branches:
      - main  # Solo producción automatizada

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_full: ${{ steps.vars.outputs.image_full }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_FULL="${{ env.REGISTRY }}/${OWNER_LOWER}/ymcasantander:${{ github.sha }}"
          
          echo "owner_lower=${OWNER_LOWER}" >> $GITHUB_OUTPUT
          echo "image_full=${IMAGE_FULL}" >> $GITHUB_OUTPUT
          
          echo "🏗️ Building production: ${IMAGE_FULL}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image_full }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lower }}/ymcasantander:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_FULL: ${{ needs.build-and-push.outputs.image_full }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_FULL
          script: |
            set -e
            
            cd /home/ubuntu/apps/ymcaSantander
            
            echo "=================================================="
            echo "🚀 Desplegando PRODUCCIÓN"
            echo "=================================================="
            
            echo "🔐 Login al registry..."
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USER }}" --password-stdin
            
            echo "📥 Pulling imagen: ${IMAGE_FULL}"
            docker pull ${IMAGE_FULL}
            
            echo "🏷️  Creando tag local: ymcasantander:latest"
            docker tag ${IMAGE_FULL} ymcasantander:latest
            
            echo "💾 Backup estado actual..."
            docker compose -f docker-compose.yml ps > /tmp/pre-deploy-production-$(date +%Y%m%d-%H%M%S).log || true
            
            echo "🚢 Desplegando producción..."
            docker compose -f docker-compose.yml up -d --no-deps ymca_santander_prod
            
            echo "⏳ Esperando arranque..."
            sleep 15
            
            echo "🏥 Verificando salud..."
            if docker ps | grep ymca_santander_prod | grep -E "Up|running"; then
              echo "✅ Producción desplegada exitosamente"
              echo "📦 Imagen: ${IMAGE_FULL}"
              
              echo "🧹 Limpiando imágenes antiguas..."
              docker image prune -f --filter "label=app=ymcasantander" || true
              
              echo "📊 Estado final producción:"
              docker compose -f docker-compose.yml ps
            else
              echo "❌ Deployment falló"
              docker compose -f docker-compose.yml logs --tail=50 ymca_santander_prod
              exit 1
            fi
            
      - name: Deployment summary
        if: success()
        run: |
          echo "### ✅ Production Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ needs.build-and-push.outputs.image_full }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY