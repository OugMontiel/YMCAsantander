name: Build and Deploy to VPS

on:
  push:
    branches:
      - main      # Producción
      - develop   # Desarrollo

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ymcasantander 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false
          
      - name: Lowercase image name
        id: lowercase
        run: |
          echo "image_name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}:${{ github.ref_name }}-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Set deployment environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "compose_file=docker-compose.yml" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "image_tag=main-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "compose_file=docker-compose.dev.yml" >> $GITHUB_OUTPUT
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "image_tag=develop-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          COMPOSE_FILE: ${{ steps.env.outputs.compose_file }}
          IMAGE_TAG: ${{ steps.env.outputs.image_tag }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: COMPOSE_FILE,IMAGE_TAG,REGISTRY_IMAGE
          script: |
            set -e
            
            cd /home/ubuntu/apps/ymcaSantander
            
            # Login al registry
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u "${{ secrets.REGISTRY_USER }}" --password-stdin
            
            # Pull de la imagen específica del registry
            docker pull ${REGISTRY_IMAGE}:${IMAGE_TAG}
            
            # ⭐ CREAR EL TAG LOCAL que usa docker-compose
            docker tag ${REGISTRY_IMAGE}:${IMAGE_TAG} ymcasantander:latest
            
            # Backup estado actual
            docker compose -f ${COMPOSE_FILE} ps > /tmp/pre-deploy-$(date +%Y%m%d-%H%M%S).log || true
            
            # Deploy con timeout
            timeout 300 docker compose -f ${COMPOSE_FILE} up -d --remove-orphans
            
            # Esperar arranque
            echo "⏳ Esperando arranque de contenedores..."
            sleep 15
            
            # Verificar salud
            if docker compose -f ${COMPOSE_FILE} ps | grep -E "Up|running"; then
              echo "✅ Deployment exitoso a ${{ steps.env.outputs.environment }}"
              echo "📦 Imagen: ${REGISTRY_IMAGE}:${IMAGE_TAG}"
              
              # Limpiar imágenes antiguas (pero mantener las últimas 3)
              docker images ${REGISTRY_IMAGE} --format "{{.Repository}}:{{.Tag}}" | tail -n +4 | xargs -r docker rmi || true
              
              # Mostrar estado
              docker compose -f ${COMPOSE_FILE} ps
            else
              echo "❌ Deployment falló - contenedores no están saludables"
              docker compose -f ${COMPOSE_FILE} logs --tail=100
              exit 1
            fi

      - name: Deployment summary
        if: success()
        run: |
          echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ steps.env.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to ${{ steps.env.outputs.environment }}
            Status: ${{ job.status }}
            Commit: ${{ github.sha }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}