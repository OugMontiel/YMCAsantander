services:
  ymca_santander:
    image: ymcasantander
    container_name: ymca_santander
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true