services:
  ymcasantander:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ymcasantander
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true