services:
  ymcasantanderweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ymcasantanderweb
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true