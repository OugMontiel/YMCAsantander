services:
  dev_ymca_santander:
    image: ghcr.io/${GITHUB_REPOSITORY}:dev-${IMAGE_TAG:-latest}
    container_name: dev_ymca_santander
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true