services:
  dev_ymca_santander:
    image: ymcasantander:dev
    container_name: dev_ymca_santander
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true